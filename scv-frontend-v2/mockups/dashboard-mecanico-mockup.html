<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mecánico - SCV</title>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Exact same base CSS as previous */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Atkinson Hyperlegible', sans-serif; background-color: #f5f8f5; color: #152118; min-height: 100vh; display: flex; }
        
        .sidebar { width: 80px; background-color: #1f6a43; height: 100vh; position: fixed; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; padding: 1.5rem 0; gap: 1.5rem; border-top-right-radius: 12px; border-bottom-right-radius: 12px;}
        .menu-btn { background: none; border: none; color: white; padding: 0.5rem; margin-bottom: 1rem; }
        .menu-btn svg { width: 24px; height: 24px; }
        .nav-item { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; text-decoration: none; transition: 0.2s; }
        .nav-item.active { background-color: #f5f8f5; color: #1f6a43; }
        .nav-item svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2;}

        .main-content { margin-left: 80px; flex: 1; padding: 1.5rem 2.5rem; display: flex; flex-direction: column; gap: 1.5rem; }
        .app-header { display: flex; justify-content: space-between; align-items: center; background: #ffffff; padding: 1.25rem 2rem; border-radius: 16px; border: 1px solid #e5e7eb; }
        .app-header h1 { font-size: 1.5rem; font-weight: 700; color: #1f6a43; text-transform: uppercase; }
        .btn-logout { background: #1f6a43; color: white; border: none; padding: 0.5rem 1rem; border-radius: 8px; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
        .btn-logout svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2;}

        .dashboard-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 1.5rem; }
        .card { background: #ffffff; border-radius: 16px; border: 1px solid #e5e7eb; padding: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        
        .kicker { color: #d4822f; font-size: 0.75rem; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; margin-bottom: 0.25rem; }
        .ops-command h2 { font-size: 1.75rem; font-weight: 700; line-height: 1.2; margin-bottom: 1.5rem; }

        .user-card { display: flex; align-items: center; gap: 1rem; padding: 1rem; border: 1px solid #e5e7eb; border-radius: 12px; background: #f8faf9; margin-bottom: 1.5rem; }
        .user-avatar { width: 48px; height: 48px; background: #eaf3ed; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #1f6a43; }
        .user-avatar svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2;}
        .user-info h3 { font-size: 1rem; color: #1f6a43; }
        .user-info p { font-size: 0.8rem; color: #6b7280; }

        /* KPIS */
        .kpis-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
        .kpi { padding: 1.25rem; border: 1px solid #e5e7eb; border-radius: 12px; background: #f8faf9; display: flex; justify-content: space-between; align-items: center;}
        .kpi-val { font-size: 1.75rem; font-weight: 700; color: #1f6a43; }
        .kpi-lbl { font-size: 0.9rem; color: #6b7280; font-weight: 500; }

        /* LIST */
        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid #e5e7eb; }
        .list-header h3 { font-size: 1.25rem; color: #1f6a43; font-weight: 700; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem; border: 1px solid #e5e7eb; border-radius: 12px; margin-bottom: 1rem; }
        .list-info h4 { font-size: 1.1rem; color: #152118; margin-bottom: 0.25rem; }
        .list-info p { font-size: 0.85rem; color: #6b7280; }
        .badge { padding: 0.25rem 0.75rem; border-radius: 50px; font-size: 0.75rem; font-weight: 700; }
        .b-warning { background: #fef3c7; color: #92400e; }
        .btn-outline { border: 1px solid #1f6a43; color: #1f6a43; background: transparent; padding: 0.5rem 1rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-outline:hover { background: #1f6a43; color: white;}
    </style>
</head>
<body>
    <aside class="sidebar">
        <button class="menu-btn"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <a href="#" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg></a>
    </aside>

    <main class="main-content">
        <header class="app-header">
            <h1>Panel Mecánico</h1>
            <button class="btn-logout"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg> CERRAR SESIÓN</button>
        </header>

        <div class="dashboard-grid">
            <div class="card ops-command">
                <div class="kicker">Mis Tareas</div>
                <h2>Órdenes Asignadas</h2>
                
                <div class="user-card">
                    <div class="user-avatar"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
                    <div class="user-info">
                        <h3>Luis G.</h3>
                        <p>Rol: Mecánico</p>
                    </div>
                </div>

                <div class="kpis-grid">
                    <div class="kpi">
                        <div class="kpi-lbl">En Proceso</div>
                        <div class="kpi-val" style="color: #d4822f;">1</div>
                    </div>
                    <div class="kpi">
                        <div class="kpi-lbl">Pendientes</div>
                        <div class="kpi-val">2</div>
                    </div>
                    <div class="kpi">
                        <div class="kpi-lbl">Completadas hoy</div>
                        <div class="kpi-val">3</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="list-header">
                    <h3>Mis órdenes activas</h3>
                </div>
                
                <div class="list-item">
                    <div class="list-info">
                        <h4><span class="badge b-warning" style="margin-right: 0.5rem;">En Proceso</span> ORD-2026-085</h4>
                        <p>Frenos Gastados • Vehículo: XYZ-987</p>
                    </div>
                    <button class="btn-outline">Ver / Actualizar Tarea</button>
                </div>
                
                <div class="list-item">
                    <div class="list-info">
                        <h4><span class="badge" style="margin-right: 0.5rem; background:#f1f5f9; color:#6b7280;">Pendiente</span> ORD-2026-089</h4>
                        <p>Revisión Eléctrica • Vehículo: DEF-456</p>
                    </div>
                    <button class="btn-outline">Ver / Actualizar Tarea</button>
                </div>

            </div>
        </div>
    </main>
</body>
</html>
