<div id="dashboard-movimientos" class="screen" data-module="dashboard-movimientos">
    <header class="app-header">
        <h1>Registro de Movimientos</h1>
        <button class="btn-logout" onclick="logout()">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg> CERRAR SESIÓN
        </button>
    </header>

    <div class="dashboard-grid">
        <div class="card ops-command">
            <div class="kicker">Flujo del patio</div>
            <h2>Centro de despacho y recepción</h2>
            
            <div class="user-card" data-user-credential>
                <div class="user-avatar"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
                <div class="user-info">
                    <h3 data-user-name>Usuario</h3>
                    <p>Rol: <strong data-user-rol>Sin rol</strong></p>
                </div>
            </div>

            <div class="big-btn-grid">
                <button class="big-btn btn-entrada" onclick="showForm('entrada')">
                    <svg viewBox="0 0 24 24"><polyline points="15 10 20 15 15 20"></polyline><path d="M4 4v7a4 4 0 0 0 4 4h12"></path></svg>
                    Registrar Entrada
                </button>
                <button class="big-btn btn-salida" onclick="showForm('salida')">
                    <svg viewBox="0 0 24 24"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg>
                    Registrar Salida
                </button>
            </div>
            
            <div style="margin-top: 1rem;">
                <button class="btn-primary" onclick="openMovimientosPanel()" style="width: 100%; justify-content: center;">
                    <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; stroke: currentColor; fill: none; margin-right: 8px;"><path d="M3 3v18h18"></path><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"></path></svg>
                    Ver Historial de Movimientos
                </button>
            </div>
        </div>

        <div class="card activity-panel">
            <h3>Movimientos Recientes</h3>
            <div class="activity-list" id="movimientos-recientes">
                <!-- Se poblará desde JS -->
            </div>
        </div>
    </div>
</div>
