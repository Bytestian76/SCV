<div id="dashboard-mecanico" class="screen" data-module="dashboard-mecanico">
    <header class="app-header">
        <h1>Panel Mecánico</h1>
        <button class="btn-logout" onclick="logout()">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg> CERRAR SESIÓN
        </button>
    </header>

    <div class="dashboard-grid">
        <div class="card ops-command">
            <div class="kicker">Mis tareas</div>
            <h2>Órdenes de trabajo asignadas</h2>
            
            <div class="ops-kpi-rack" style="display: flex; gap: 1rem; margin-bottom: 2rem;">
                <div class="stat-card" style="flex: 1; text-align: center; background: #fff4df; padding: 1.5rem; border-radius: 12px; border: 1px solid #e0ba7c;">
                    <span class="stat-number" id="mec-stat-pendientes" style="font-size: 2rem; font-weight: 700; color: #874a03; display: block;">0</span>
                    <span class="stat-label" style="font-size: 0.85rem; color: #874a03; text-transform: uppercase;">Pendientes</span>
                </div>
                <div class="stat-card" style="flex: 1; text-align: center; background: #e3f2fd; padding: 1.5rem; border-radius: 12px; border: 1px solid #90caf9;">
                    <span class="stat-number" id="mec-stat-en-proceso" style="font-size: 2rem; font-weight: 700; color: #0d47a1; display: block;">0</span>
                    <span class="stat-label" style="font-size: 0.85rem; color: #0d47a1; text-transform: uppercase;">En proceso</span>
                </div>
                <div class="stat-card" style="flex: 1; text-align: center; background: #e9f8f0; padding: 1.5rem; border-radius: 12px; border: 1px solid #8dc9a3;">
                    <span class="stat-number" id="mec-stat-completadas-hoy" style="font-size: 2rem; font-weight: 700; color: #0f5f35; display: block;">0</span>
                    <span class="stat-label" style="font-size: 0.85rem; color: #0f5f35; text-transform: uppercase;">Completadas hoy</span>
                </div>
            </div>

            <div class="user-card" data-user-credential>
                <div class="user-avatar"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 9.36l-7.1 7.1a1 1 0 0 1-1.41-1.41l7.1-7.1a6 6 0 0 1 9.36-7.94l-3.77 3.77a1 1 0 0 0 0 1.41z"></path></svg></div>
                <div class="user-info">
                    <h3 data-user-name>Usuario</h3>
                    <p>Rol: <strong data-user-rol>Sin rol</strong></p>
                </div>
            </div>

            <div class="big-btn-grid" style="margin-top: 1.5rem;">
                <button class="big-btn btn-entrada" onclick="navigate('admin-ordenes')" style="justify-content: center; width: 100%;">
                    <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 9.36l-7.1 7.1a1 1 0 0 1-1.41-1.41l7.1-7.1a6 6 0 0 1 9.36-7.94l-3.77 3.77a1 1 0 0 0 0 1.41z"></path></svg>
                    Ver Mis Órdenes
                </button>
            </div>
        </div>

        <div class="card activity-panel">
            <h3>Mis órdenes activas</h3>
            <div class="activity-list" id="mec-ordenes-activas">
                <!-- Se poblará desde JS -->
            </div>
        </div>
    </div>
</div>
