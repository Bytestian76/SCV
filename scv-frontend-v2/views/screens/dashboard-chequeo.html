<div id="dashboard-chequeo" class="screen" data-module="dashboard-chequeo">
    <header class="app-header">
        <h1>Lista de Chequeo</h1>
        <button class="btn-logout" onclick="logout()">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg> CERRAR SESIÓN
        </button>
    </header>

    <div class="dashboard-grid">
        <div class="card ops-command">
            <div class="kicker">Preoperacional</div>
            <h2>Inicia una inspección de seguridad</h2>
            
            <div class="user-card" data-user-credential>
                <div class="user-avatar"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9 12l2 2 4-4"></path></svg></div>
                <div class="user-info">
                    <h3 data-user-name>Usuario</h3>
                    <p>Rol: <strong data-user-rol>Sin rol</strong></p>
                </div>
            </div>

            <div class="big-btn-grid">
                <button class="big-btn btn-entrada" onclick="showForm('chequeo')">
                    <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9 12l2 2 4-4"></path></svg>
                    Realizar Lista de Chequeo
                </button>
            </div>
            
            <div style="margin-top: 1rem;">
                <button class="btn-primary" onclick="openChequeosPanel()" style="width: 100%; justify-content: center;">
                    <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; stroke: currentColor; fill: none; margin-right: 8px;"><path d="M3 3v18h18"></path><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"></path></svg>
                    Ver Historial de Chequeos
                </button>
            </div>
        </div>

        <div class="card activity-panel">
            <h3>Últimos chequeos</h3>
            <div class="activity-list" id="chequeos-recientes">
                <!-- Se poblará desde JS -->
            </div>
        </div>
    </div>
</div>
