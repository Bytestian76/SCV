<!-- Pantalla Gestión de Órdenes de Trabajo -->
<div id="admin-ordenes" class="screen" data-module="admin-ordenes">
    <!-- HEADER -->
    <header class="app-header">
        <h1>GESTIÓN DE ÓRDENES</h1>
        <div class="header-actions">
            <button class="btn-outline" onclick="goBack()">
                <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                VOLVER
            </button>
            <button class="btn-logout" onclick="logout()">
                <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                CERRAR SESIÓN
            </button>
        </div>
    </header>

    <!-- TOOLBAR -->
    <div class="toolbar">
        <div class="toolbar-filters">
            <div class="search-box">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input id="ordenes-search" type="text" placeholder="Buscar vehículo, descripción...">
            </div>
            <select id="ordenes-filtro-estado" class="filter-select">
                <option value="todas">Cualquier Estado</option>
                <option value="pendiente">Pendiente</option>
                <option value="asignada">Asignada</option>
                <option value="en_progreso">En progreso</option>
                <option value="pausada">Pausada</option>
                <option value="completada">Completada</option>
                <option value="cancelada">Cancelada</option>
            </select>
            <select id="ordenes-filtro-prioridad" class="filter-select">
                <option value="todas">Cualquier Prioridad</option>
                <option value="baja">Baja</option>
                <option value="media">Media</option>
                <option value="alta">Alta</option>
                <option value="urgente">Urgente</option>
            </select>
            <button id="ordenes-clear-filters" type="button" class="btn-outline" style="border-color: var(--border); color: var(--text-muted);">Limpiar</button>
        </div>
        
        <!-- ACTION BUTTON NEW -->
        <button id="orden-nuevo-btn" class="btn-primary">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Nueva Orden
        </button>
    </div>

    <!-- TABLE CARD -->
    <p id="ordenes-results" class="helper-text" style="color: var(--text-muted); font-size: 0.85rem; padding-left: 1rem;"></p>
    <div class="table-card">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Vehículo</th>
                        <th>Mecánico</th>
                        <th>Estado/Prioridad</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="ordenes-list">
                    <!-- Javascript content -->
                </tbody>
            </table>
        </div>
    </div>
</div>
