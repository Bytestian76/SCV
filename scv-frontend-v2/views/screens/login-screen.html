<div id="login-screen" class="screen active">
    <div class="login-wrapper">
        <div class="login-banner">
            <div class="banner-content">
                <div class="kicker">Centro de operaciones</div>
                <h1 class="banner-title">Control Vehicular para Jornada Industrial</h1>
                <p class="banner-desc">Monitorea entradas, salidas e inspecciones con trazabilidad en tiempo real para el patio de carga.</p>
                
                <div class="banner-markers">
                    <span class="marker">Despacho</span>
                    <span class="marker">Chequeo</span>
                    <span class="marker">Turnos</span>
                </div>
            </div>
            
            <div style="font-size: 0.8rem; color: rgba(255,255,255,0.5); z-index: 1;">
                &copy; 2026 SCV Operaciones
            </div>
        </div>

        <div class="login-form-container">
            <div class="login-brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"></path><path d="M8 12l4-4 4 4"></path><path d="M12 8v12"></path></svg>
                </div>
                <div class="brand-text">Sistema de<br>Control Vehicular</div>
            </div>

            <div class="login-header">
                <h2>Iniciar Sesión</h2>
                <p>Ingresa tus credenciales para acceder</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">Usuario o Correo</label>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        </div>
                        <input type="text" id="email" name="email" class="form-input" placeholder="Ej. jperez" autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        </div>
                        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <span class="btn-text">Ingresar a SCV</span>
                    <svg class="btn-icon" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    <span class="btn-loading" style="display:none;">
                        <svg viewBox="0 0 24 24" style="animation: spin 1s linear infinite;"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>
                        Conectando...
                    </span>
                </button>

                <p class="login-feedback" id="login-error"></p>
            </form>
        </div>
    </div>
</div>
