<div id="dashboard-admin" class="screen" data-module="dashboard-admin">
    <header class="app-header">
        <h1>Tablero de despacho</h1>
        <button class="btn-logout" onclick="logout()">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg> CERRAR SESIÓN
        </button>
    </header>

    <div class="dashboard-grid">
        <div class="card ops-command">
            <div class="kicker">Estado del turno</div>
            <h2>Centro de mando de movilidad</h2>
            
            <div style="background: #e9f8f0; padding: 1.5rem; border-radius: 12px; border: 1px solid #8dc9a3; margin-bottom: 1.5rem;">
                <span class="stat-number" id="stat-movimientos" style="font-size: 2.5rem; font-weight: 700; color: #0f5f35; display: block;">0</span>
                <span class="stat-label" style="font-size: 0.95rem; color: #0f5f35; text-transform: uppercase;">Movimientos reportados hoy</span>
            </div>

            <div class="ops-kpi-rack" style="display: flex; gap: 1rem; margin-bottom: 2rem;">
                <div class="stat-card" style="flex: 1; text-align: center; background: #fdf3e7; padding: 1rem; border-radius: 12px; border: 1px solid #e0ba7c;">
                    <span class="stat-number" id="stat-vehiculos" style="font-size: 1.5rem; font-weight: 700; color: #874a03; display: block;">0</span>
                    <span class="stat-label" style="font-size: 0.75rem; color: #874a03; text-transform: uppercase;">Vehículos Activos</span>
                </div>
                <div class="stat-card" style="flex: 1; text-align: center; background: #e3f2fd; padding: 1rem; border-radius: 12px; border: 1px solid #90caf9;">
                    <span class="stat-number" id="stat-conductores" style="font-size: 1.5rem; font-weight: 700; color: #0d47a1; display: block;">0</span>
                    <span class="stat-label" style="font-size: 0.75rem; color: #0d47a1; text-transform: uppercase;">Conductores en línea</span>
                </div>
                <div class="stat-card" style="flex: 1; text-align: center; background: #f3e5f5; padding: 1rem; border-radius: 12px; border: 1px solid #ce93d8;">
                    <span class="stat-number" id="stat-chequeos" style="font-size: 1.5rem; font-weight: 700; color: #4a148c; display: block;">0</span>
                    <span class="stat-label" style="font-size: 0.75rem; color: #4a148c; text-transform: uppercase;">Chequeos del día</span>
                </div>
            </div>

            <div class="user-card" data-user-credential>
                <div class="user-avatar"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></div>
                <div class="user-info">
                    <h3 data-user-name>Usuario</h3>
                    <p>Rol: <strong data-user-rol>Sin rol</strong></p>
                </div>
            </div>
        </div>

        <div class="card activity-panel" style="display: flex; flex-direction: column;">
            <h3>Acciones Rápidas</h3>
            <div class="actions-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem;">
                <button class="action-btn" onclick="navigate('vehiculos')" style="padding: 1rem; background: #f8faf9; border: 1px solid #e5e7eb; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
                    <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; color: #1f6a43; stroke: currentColor; fill: none; stroke-width: 2;"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
                    <span style="font-weight: 600; font-size: 0.85rem;">Vehículos</span>
                </button>
                <button class="action-btn" onclick="navigate('conductores')" style="padding: 1rem; background: #f8faf9; border: 1px solid #e5e7eb; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
                    <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; color: #1f6a43; stroke: currentColor; fill: none; stroke-width: 2;"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    <span style="font-weight: 600; font-size: 0.85rem;">Conductores</span>
                </button>
                <button class="action-btn" onclick="navigate('usuarios')" style="padding: 1rem; background: #f8faf9; border: 1px solid #e5e7eb; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
                    <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; color: #1f6a43; stroke: currentColor; fill: none; stroke-width: 2;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <span style="font-weight: 600; font-size: 0.85rem;">Usuarios</span>
                </button>
                <button class="action-btn" onclick="navigate('movimientos')" style="padding: 1rem; background: #f8faf9; border: 1px solid #e5e7eb; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
                    <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; color: #1f6a43; stroke: currentColor; fill: none; stroke-width: 2;"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                    <span style="font-weight: 600; font-size: 0.85rem;">Movimientos</span>
                </button>
                <button class="action-btn" onclick="navigate('chequeos')" style="padding: 1rem; background: #f8faf9; border: 1px solid #e5e7eb; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
                    <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; color: #1f6a43; stroke: currentColor; fill: none; stroke-width: 2;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9 12l2 2 4-4"></path></svg>
                    <span style="font-weight: 600; font-size: 0.85rem;">Chequeos</span>
                </button>
                <button class="action-btn" onclick="navigate('admin-estadisticas')" style="padding: 1rem; background: #f8faf9; border: 1px solid #e5e7eb; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
                    <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; color: #1f6a43; stroke: currentColor; fill: none; stroke-width: 2;"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                    <span style="font-weight: 600; font-size: 0.85rem;">Estadísticas</span>
                </button>
            </div>

            <h3 style="margin-top: auto; padding-top: 1rem; border-top: 1px solid #e5e7eb;">Lectura dinámica</h3>
            <div class="toolbar-actions" style="display: flex; gap: 1rem; margin-top: 1rem;">
                <div class="form-group compact-control" style="flex: 1;">
                    <select id="admin-chart-range" class="form-input" style="padding: 0.5rem;">
                        <option value="7">Últimos 7 días</option>
                        <option value="15">Últimos 15 días</option>
                        <option value="30">Últimos 30 días</option>
                        <option value="60">Últimos 60 días</option>
                    </select>
                </div>
                <button id="admin-refresh-btn" type="button" class="btn-primary" style="padding: 0.5rem 1rem;">Actualizar</button>
            </div>
            
            <div class="analytics-grid" style="margin-top: 1rem;">
                <article class="analytics-card analytics-card-wide" style="border: 1px solid #e5e7eb; border-radius: 12px; padding: 1rem;">
                    <div class="chart-panel-head" style="font-weight: 700; margin-bottom: 0.5rem;">Tendencia diaria</div>
                    <div class="chart-holder">
                        <div id="admin-trend-chart" class="trend-chart" style="height: 200px;"></div>
                    </div>
                </article>
            </div>
        </div>
    </div>
</div>
