<!-- Pantalla Gestión de Vehículos (Admin) -->
<div id="admin-vehiculos" class="screen" data-module="admin-vehiculos">
    <!-- HEADER -->
    <header class="app-header">
        <h1>GESTIÓN DE VEHÍCULOS</h1>
        <div class="header-actions">
            <button class="btn-outline" onclick="goBack()">
                <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                VOLVER
            </button>
            <button class="btn-logout" onclick="logout()">
                <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                CERRAR SESIÓN
            </button>
        </div>
    </header>

    <!-- TOOLBAR -->
    <div class="toolbar">
        <div class="toolbar-filters">
            <div class="search-box">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input id="vehiculos-search" type="text" placeholder="Buscar por placa, tipo o marca...">
            </div>
            <select id="vehiculos-estado" class="filter-select">
                <option value="todos">Todos los Estados</option>
                <option value="activos">Solo activos</option>
                <option value="inactivos">Solo inactivos</option>
            </select>
            <select id="vehiculos-orden" class="filter-select">
                <option value="placa_asc">Placa (A-Z)</option>
                <option value="placa_desc">Placa (Z-A)</option>
                <option value="anio_desc">Año (más reciente)</option>
                <option value="anio_asc">Año (más antiguo)</option>
            </select>
            <button id="vehiculos-clear-filters" type="button" class="btn-outline" style="border-color: var(--border); color: var(--text-muted);">Limpiar</button>
            <button id="vehiculos-export-excel-btn" type="button" class="btn-outline" style="border-color: var(--border); color: var(--text-muted);">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg> EXCEL
            </button>
            <button id="vehiculos-export-pdf-btn" type="button" class="btn-outline" style="border-color: var(--border); color: var(--text-muted);">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg> PDF
            </button>
        </div>
        
        <!-- ACTION BUTTON NEW -->
        <button id="vehiculo-nuevo-btn" class="btn-primary">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Registrar Vehículo
        </button>
    </div>

    <!-- TABLE CARD -->
    <p id="vehiculos-results" class="helper-text" style="color: var(--text-muted); font-size: 0.85rem; padding-left: 1rem;"></p>
    <div class="table-card">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Identificación (Placa)</th>
                        <th>Tipo de Vehículo</th>
                        <th>Detalles</th>
                        <th>Estado Actual</th>
                        <th>Vencimientos</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="vehiculos-list">
                    <!-- Javascript content -->
                </tbody>
            </table>
        </div>
    </div>
</div>
