<div id="dashboard-jefe-mecanicos" class="screen" data-module="dashboard-jefe-mecanicos">
    <header class="app-header">
        <h1>Panel de Mantenimiento</h1>
        <button class="btn-logout" onclick="logout()">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg> CERRAR SESIÓN
        </button>
    </header>

    <div class="dashboard-grid">
        <div class="card ops-command">
            <div class="kicker">Supervisión</div>
            <h2>Gestión de Hallazgos y Mantenimientos</h2>
            
            <div style="background: #fdf3e7; padding: 1.5rem; border-radius: 12px; border: 1px solid #e0ba7c; margin-bottom: 1.5rem;">
                <span class="stat-number" id="jefe-stat-hallazgos-pendientes" style="font-size: 2.5rem; font-weight: 700; color: #874a03; display: block;">0</span>
                <span class="stat-label" style="font-size: 0.95rem; color: #874a03; text-transform: uppercase;">Hallazgos pendientes de evaluación</span>
            </div>

            <div class="ops-kpi-rack" style="display: flex; gap: 1rem; margin-bottom: 2rem;">
                <div class="stat-card" style="flex: 1; text-align: center; background: #e3f2fd; padding: 1rem; border-radius: 12px; border: 1px solid #90caf9;">
                    <span class="stat-number" id="jefe-stat-ordenes-abiertas" style="font-size: 1.5rem; font-weight: 700; color: #0d47a1; display: block;">0</span>
                    <span class="stat-label" style="font-size: 0.75rem; color: #0d47a1; text-transform: uppercase;">Órdenes abiertas</span>
                </div>
                <div class="stat-card" style="flex: 1; text-align: center; background: #e9f8f0; padding: 1rem; border-radius: 12px; border: 1px solid #8dc9a3;">
                    <span class="stat-number" id="jefe-stat-ordenes-hoy" style="font-size: 1.5rem; font-weight: 700; color: #0f5f35; display: block;">0</span>
                    <span class="stat-label" style="font-size: 0.75rem; color: #0f5f35; text-transform: uppercase;">Órdenes hoy</span>
                </div>
                <div class="stat-card" style="flex: 1; text-align: center; background: #f3e5f5; padding: 1rem; border-radius: 12px; border: 1px solid #ce93d8;">
                    <span class="stat-number" id="jefe-stat-mecanicos-activos" style="font-size: 1.5rem; font-weight: 700; color: #4a148c; display: block;">0</span>
                    <span class="stat-label" style="font-size: 0.75rem; color: #4a148c; text-transform: uppercase;">Mecánicos activos</span>
                </div>
            </div>

            <div class="user-card" data-user-credential>
                <div class="user-avatar"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></div>
                <div class="user-info">
                    <h3 data-user-name>Usuario</h3>
                    <p>Rol: <strong data-user-rol>Sin rol</strong></p>
                </div>
            </div>
        </div>

        <div class="card activity-panel" style="display: flex; flex-direction: column;">
            <h3>Acciones Rápidas</h3>
            <div class="actions-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem;">
                <button class="action-btn" onclick="navigate('admin-hallazgos')" style="padding: 1.5rem; background: #f8faf9; border: 1px solid #e5e7eb; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.75rem;">
                    <svg viewBox="0 0 24 24" style="width: 32px; height: 32px; color: #1f6a43; stroke: currentColor; fill: none; stroke-width: 2;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <span style="font-weight: 600;">Gestionar Hallazgos</span>
                </button>
                <button class="action-btn" onclick="navigate('admin-ordenes')" style="padding: 1.5rem; background: #f8faf9; border: 1px solid #e5e7eb; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.75rem;">
                    <svg viewBox="0 0 24 24" style="width: 32px; height: 32px; color: #1f6a43; stroke: currentColor; fill: none; stroke-width: 2;"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 9.36l-7.1 7.1a1 1 0 0 1-1.41-1.41l7.1-7.1a6 6 0 0 1 9.36-7.94l-3.77 3.77a1 1 0 0 0 0 1.41z"></path></svg>
                    <span style="font-weight: 600;">Gestionar Órdenes</span>
                </button>
                <button class="action-btn" onclick="navigate('vehiculos')" style="padding: 1.5rem; background: #f8faf9; border: 1px solid #e5e7eb; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.75rem;">
                    <svg viewBox="0 0 24 24" style="width: 32px; height: 32px; color: #1f6a43; stroke: currentColor; fill: none; stroke-width: 2;"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
                    <span style="font-weight: 600;">Gestionar Vehículos</span>
                </button>
                <button class="action-btn" onclick="navigate('admin-estadisticas')" style="padding: 1.5rem; background: #f8faf9; border: 1px solid #e5e7eb; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.75rem;">
                    <svg viewBox="0 0 24 24" style="width: 32px; height: 32px; color: #1f6a43; stroke: currentColor; fill: none; stroke-width: 2;"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                    <span style="font-weight: 600;">Estadísticas Mantenimiento</span>
                </button>
            </div>

            <h3 style="margin-top: auto; padding-top: 1rem; border-top: 1px solid #e5e7eb;">Resumen de Operaciones</h3>
            <div class="activity-list" id="jefe-resumen-ordenes" style="margin-top: 1rem;">
                <!-- Se poblará desde JS -->
            </div>
        </div>
    </div>
</div>
