<!-- Pantalla Historial de Movimientos (Admin) -->
<div id="admin-movimientos" class="screen" data-module="admin-movimientos">
    <!-- HEADER -->
    <header class="app-header">
        <h1>HISTORIAL DE MOVIMIENTOS</h1>
        <div class="header-actions">
            <button class="btn-outline" onclick="goBack()">
                <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                VOLVER
            </button>
            <button class="btn-logout" onclick="logout()">
                <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                CERRAR SESIÓN
            </button>
        </div>
    </header>

    <!-- TOOLBAR -->
    <div class="toolbar">
        <div class="toolbar-filters">
            <div class="search-box">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input id="movimientos-search" type="text" placeholder="Buscar placa, conductor...">
            </div>
            <select id="movimientos-tipo" class="filter-select">
                <option value="todos">Todos los Tipos</option>
                <option value="entrada">Entradas</option>
                <option value="salida">Salidas</option>
            </select>
            <input type="date" id="movimientos-fecha-inicio" class="filter-select" style="max-width: 150px;">
            <input type="date" id="movimientos-fecha-fin" class="filter-select" style="max-width: 150px;">
            <button id="movimientos-clear-filters" type="button" class="btn-outline" style="border-color: var(--border); color: var(--text-muted);">Limpiar</button>
        </div>
        
        <!-- ACTION BUTTON NEW -->
        <div style="display: flex; gap: 0.5rem;">
            <button id="movimiento-entrada-btn" class="btn-primary" style="background: var(--gray-dark);">
                <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Nueva Entrada
            </button>
            <button id="movimiento-salida-btn" class="btn-primary">
                <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Nueva Salida
            </button>
        </div>
    </div>

    <!-- TABLE CARD -->
    <p id="movimientos-results" class="helper-text" style="color: var(--text-muted); font-size: 0.85rem; padding-left: 1rem;"></p>
    <div class="table-card">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Fecha y Tipo</th>
                        <th>Vehículo</th>
                        <th>Conductor</th>
                        <th>Detalles / Destino</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="movimientos-list">
                    <!-- Javascript content -->
                </tbody>
            </table>
        </div>
    </div>
</div>
