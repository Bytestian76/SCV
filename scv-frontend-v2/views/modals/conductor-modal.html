<!-- Modal Conductor (Nuevo/Editar) -->
<div id="conductor-modal" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="conductor-form-title">
        <div class="modal-header">
            <h2 id="conductor-form-title">Nuevo conductor</h2>
            <button id="conductor-close-btn" type="button" class="btn-close" aria-label="Cerrar formulario">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <form id="conductor-form" class="management-form">
            <div class="modal-body">
                <div class="form-row">
                    <div class="form-group">
                        <label for="cnd-nombres">Nombres *</label>
                        <input id="cnd-nombres" name="nombres" type="text" required maxlength="100" placeholder="Ej: Juan Perez">
                    </div>
                    <div class="form-group">
                        <label for="cnd-cedula">Cédula *</label>
                        <input id="cnd-cedula" name="cedula" type="text" required maxlength="30" placeholder="Ej: 123456789">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="cnd-telefono">Teléfono *</label>
                        <input id="cnd-telefono" name="telefono" type="text" required maxlength="30" placeholder="Ej: 3001234567">
                    </div>
                    <div class="form-group">
                        <label for="cnd-correo">Correo</label>
                        <input id="cnd-correo" name="correo" type="email" maxlength="150" placeholder="juan@ejemplo.com">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="cnd-licencia">No. Licencia *</label>
                        <input id="cnd-licencia" name="licencia" type="text" required maxlength="30" placeholder="Número de licencia">
                    </div>
                    <div class="form-group">
                        <label for="cnd-venc-licencia">Vencimiento Licencia *</label>
                        <input id="cnd-venc-licencia" name="fecha_venc_licencia" type="date" required>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="conductor-cancel-btn" type="button" class="btn-secondary">Cancelar</button>
                <button type="submit" class="btn-primary">
                    <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    Guardar
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Detalles del Conductor (VER) -->
<div id="conductor-detalle-modal" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="conductor-detalle-title">
        <div class="modal-header">
            <h2 id="conductor-detalle-title">Detalles del Conductor</h2>
            <button id="conductor-detalle-close-btn" type="button" class="btn-close" aria-label="Cerrar detalles">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="modal-body">
            <div class="detail-header-block">
                <div class="detail-avatar">
                    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                </div>
                <div>
                    <div id="detalle-cnd-nombres" style="font-size: 1.5rem; font-weight: 700; color: var(--primary);">Nombre Conductor</div>
                    <div id="detalle-cnd-estado" class="badge badge-success">Activo</div>
                </div>
            </div>

            <div class="details-grid">
                <div class="detail-item">
                    <div class="detail-label">Cédula</div>
                    <div class="detail-value" id="detalle-cnd-cedula">---</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Teléfono</div>
                    <div class="detail-value" id="detalle-cnd-telefono">---</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Correo</div>
                    <div class="detail-value" id="detalle-cnd-correo">---</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Licencia</div>
                    <div class="detail-value" id="detalle-cnd-licencia">---</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Vencimiento Licencia</div>
                    <div class="detail-value" id="detalle-cnd-venc-licencia">---</div>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button id="conductor-detalle-close-btn2" type="button" class="btn-secondary">Cerrar</button>
        </div>
    </div>
</div>
