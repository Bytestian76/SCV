<!-- Formulario de Chequeo Preoperacional -->
<div id="chequeo-modal" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="chequeo-form-title">
        <div class="modal-header">
            <h2 id="chequeo-form-title">Chequeo Preoperacional</h2>
            <button id="chequeo-close-btn" type="button" class="btn-close" aria-label="Cerrar formulario">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <form id="chequeo-form" class="management-form chequeo-form-scroll">
            <div class="modal-body">
                <div class="form-section">
                    <h3 style="font-size: 1rem; color: var(--primary); margin-bottom: 1rem;">Datos del Vehículo</h3>
                    <div class="form-group selector-search-group">
                        <label for="ch-vehiculo-search">Vehículo *</label>
                        <input type="search" id="ch-vehiculo-search" class="form-input" placeholder="Escribe placa, marca o modelo" autocomplete="off">
                        <input type="hidden" id="ch-vehiculo" name="vehiculo_id">
                        <div id="ch-vehiculo-results" class="selector-results" role="listbox" aria-label="Resultados de vehiculos"></div>
                        <p id="ch-vehiculo-selected" class="selector-selected">Sin vehículo seleccionado.</p>
                    </div>
                    <div class="form-group selector-search-group">
                        <label for="ch-conductor-search">Conductor *</label>
                        <input type="search" id="ch-conductor-search" class="form-input" placeholder="Escribe nombre o cedula" autocomplete="off">
                        <input type="hidden" id="ch-conductor" name="conductor_id">
                        <div id="ch-conductor-results" class="selector-results" role="listbox" aria-label="Resultados de conductores"></div>
                        <p id="ch-conductor-selected" class="selector-selected">Sin conductor seleccionado.</p>
                    </div>
                    <div class="form-group">
                        <label for="ch-kilometraje">Kilometraje *</label>
                        <input type="number" id="ch-kilometraje" name="kilometraje" class="form-input" required min="0" placeholder="Se completa al elegir vehiculo">
                    </div>
                </div>

                <div class="form-section" style="margin-top: 1.5rem;">
                    <h3 style="font-size: 1rem; color: var(--primary); margin-bottom: 1rem;">Fechas de Vencimiento</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="ch-soat">SOAT</label>
                            <input type="date" id="ch-soat" class="form-input" name="fecha_venc_soat">
                        </div>
                        <div class="form-group">
                            <label for="ch-rtm">RTM</label>
                            <input type="date" id="ch-rtm" class="form-input" name="fecha_venc_rtm">
                        </div>
                        <div class="form-group">
                            <label for="ch-extintor">Extintor</label>
                            <input type="date" id="ch-extintor" class="form-input" name="fecha_venc_extintor">
                        </div>
                    </div>
                </div>

                <div id="secciones-chequeo" style="margin-top: 1.5rem;"></div>

                <div class="form-section" style="margin-top: 1.5rem;">
                    <div class="form-group">
                        <label for="ch-obs">Observaciones Generales</label>
                        <textarea id="ch-obs" name="obs_generales" class="form-input" rows="3"></textarea>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="chequeo-cancel-btn" type="button" class="btn-secondary">Cancelar</button>
                <button type="submit" class="btn-primary">
                    <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    Finalizar Chequeo
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Detalle de Chequeo -->
<div id="chequeo-detalle-modal" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="chequeo-detalle-title">
        <div class="modal-header">
            <h2 id="chequeo-detalle-title">Detalle de chequeo</h2>
            <button id="chequeo-detalle-close" type="button" class="btn-close" aria-label="Cerrar detalle">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="modal-body" id="chequeo-detalle-content" style="padding-top: 1rem; padding-bottom: 1rem;">
            <!-- Contenido dinámico del detalle -->
        </div>
        <div class="modal-footer">
            <button id="chequeo-detalle-accept" type="button" class="btn-primary">Cerrar</button>
        </div>
    </div>
</div>
