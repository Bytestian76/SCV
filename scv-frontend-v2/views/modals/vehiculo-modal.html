<!-- Modal Vehículo (Nuevo/Editar) -->
<div id="vehiculo-modal" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="vehiculo-form-title">
        <div class="modal-header">
            <h2 id="vehiculo-form-title">Nuevo vehículo</h2>
            <button id="vehiculo-close-btn" type="button" class="btn-close" aria-label="Cerrar formulario">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <form id="vehiculo-form" class="management-form">
            <div class="modal-body">
                <div class="form-group">
                    <label for="vh-placa">Placa *</label>
                    <input id="vh-placa" name="placa" type="text" required maxlength="20" placeholder="ABC123">
                </div>
                <div class="form-group">
                    <label for="vh-marca">Marca *</label>
                    <input id="vh-marca" name="marca" type="text" required maxlength="80" placeholder="Chevrolet">
                </div>
                <div class="form-group">
                    <label for="vh-modelo">Modelo *</label>
                    <input id="vh-modelo" name="modelo" type="text" required maxlength="80" placeholder="NHR">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="vh-anio">Año *</label>
                        <input id="vh-anio" name="año" type="number" required min="1950" max="2100" placeholder="2022">
                    </div>
                    <div class="form-group">
                        <label for="vh-kilometraje">Kilometraje actual *</label>
                        <input id="vh-kilometraje" name="kilometraje" type="number" required min="0" placeholder="Ej: 125000">
                    </div>
                </div>
                <div class="form-group">
                    <label for="vh-empresa">Empresa</label>
                    <input id="vh-empresa" name="empresa" type="text" maxlength="120" placeholder="Normetales S.A.S">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="vh-soat">Vencimiento SOAT</label>
                        <input id="vh-soat" name="fecha_venc_soat" type="date">
                    </div>
                    <div class="form-group">
                        <label for="vh-rtm">Vencimiento RTM</label>
                        <input id="vh-rtm" name="fecha_venc_rtm" type="date">
                    </div>
                </div>
                <div class="form-group">
                    <label for="vh-especificaciones">Especificaciones del Vehículo</label>
                    <textarea id="vh-especificaciones" name="especificaciones" placeholder="Ej: Aceite: Mobil Delvac 15W-40" rows="3"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button id="vehiculo-cancel-btn" type="button" class="btn-secondary">Cancelar</button>
                <button type="submit" class="btn-primary">
                    <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    Guardar
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Detalles del Vehículo (VER) -->
<div id="vehiculo-detalle-modal" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="vehiculo-detalle-title">
        <div class="modal-header">
            <h2 id="vehiculo-detalle-title">Detalles del Vehículo</h2>
            <button id="vehiculo-detalle-close-btn" type="button" class="btn-close" aria-label="Cerrar detalles">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="modal-body">
            <div class="detail-header-block">
                <div class="detail-avatar">
                    <svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
                </div>
                <div>
                    <div id="detalle-vh-placa" style="font-size: 1.5rem; font-weight: 700; color: var(--primary);">ABC-123</div>
                    <div id="detalle-vh-estado" class="badge badge-neutral">Estado</div>
                </div>
            </div>

            <div class="details-grid">
                <div class="detail-item">
                    <div class="detail-label">Marca / Modelo</div>
                    <div class="detail-value" id="detalle-vh-marca-modelo">---</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Año</div>
                    <div class="detail-value" id="detalle-vh-anio">---</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Kilometraje</div>
                    <div class="detail-value" id="detalle-vh-km">---</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Empresa</div>
                    <div class="detail-value" id="detalle-vh-empresa">---</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Venc. SOAT</div>
                    <div class="detail-value" id="detalle-vh-soat">---</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Venc. RTM</div>
                    <div class="detail-value" id="detalle-vh-rtm">---</div>
                </div>
            </div>
            
            <div class="details-grid full">
                <div class="detail-item">
                    <div class="detail-label">Especificaciones</div>
                    <div class="detail-value" id="detalle-vh-especs" style="white-space: pre-line;">---</div>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button id="vehiculo-detalle-close-btn2" type="button" class="btn-secondary">Cerrar</button>
            <button id="vehiculo-btn-historial" type="button" class="btn-primary">
                <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                Ver Historial Mantenimientos
            </button>
        </div>
    </div>
</div>

<!-- Modal Historial de Mantenimientos del Vehículo -->
<div id="vehiculo-historial-modal" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="vehiculo-historial-title">
        <div class="modal-header">
            <h2 id="vehiculo-historial-title">Historial de Mantenimientos</h2>
            <button id="vehiculo-historial-close-btn" type="button" class="btn-close" aria-label="Cerrar">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="modal-body">
            <div id="vehiculo-historial-timeline" class="timeline-container">
                <!-- Carga dinámica del historial -->
            </div>
        </div>
        <div class="modal-footer">
            <button id="vehiculo-historial-close-btn2" type="button" class="btn-secondary">Cerrar</button>
        </div>
    </div>
</div>
