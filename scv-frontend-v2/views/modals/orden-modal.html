<!-- Modal Orden de Trabajo (Crear/Editar) -->
<div id="orden-modal" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="orden-form-title">
        <div class="modal-header">
            <h2 id="orden-form-title">Nueva Orden de Trabajo</h2>
            <button id="orden-close-btn" type="button" class="btn-close" aria-label="Cerrar formulario">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <form id="orden-form" class="management-form">
            <div class="modal-body">
                <div class="form-group selector-search-group">
                    <label for="orden-vehiculo-search">Vehículo *</label>
                    <input type="search" id="orden-vehiculo-search" class="form-input" placeholder="Escribe placa, marca o modelo" autocomplete="off">
                    <input type="hidden" id="orden-vehiculo-id" name="vehiculo_id">
                    <div id="orden-vehiculo-results" class="selector-results" role="listbox" aria-label="Resultados de vehiculos"></div>
                    <p id="orden-vehiculo-selected" class="selector-selected">Sin vehículo seleccionado.</p>
                </div>
                <div class="form-group">
                    <label for="orden-titulo">Título *</label>
                    <input type="text" id="orden-titulo" name="titulo" class="form-input" required maxlength="200" placeholder="Título de la orden">
                </div>
                <div class="form-group">
                    <label for="orden-descripcion">Descripción</label>
                    <textarea id="orden-descripcion" name="descripcion" class="form-input" rows="3" placeholder="Descripción de la orden"></textarea>
                </div>
                <div class="form-group">
                    <label for="orden-prioridad">Prioridad *</label>
                    <select id="orden-prioridad" name="prioridad" class="form-input" required>
                        <option value="baja">Baja</option>
                        <option value="media">Media</option>
                        <option value="alta">Alta</option>
                        <option value="urgente">Urgente</option>
                    </select>
                </div>
                <div class="form-group selector-search-group">
                    <label for="orden-mecanico-search">Asignar a Mecánico</label>
                    <input type="search" id="orden-mecanico-search" class="form-input" placeholder="Buscar mecánico..." autocomplete="off">
                    <input type="hidden" id="orden-mecanico-id" name="mecanico_id">
                    <div id="orden-mecanico-results" class="selector-results" role="listbox" aria-label="Resultados de mecanicos"></div>
                    <p id="orden-mecanico-selected" class="selector-selected">Sin mecánico asignado.</p>
                </div>
                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" id="orden-es-tercero"> Es responsable externo / tercero (Otro)
                    </label>
                </div>
                <div class="form-group" id="orden-responsable-externo-group" style="display: none;">
                    <label for="orden-responsable-externo">Nombre del Responsable Externo</label>
                    <input type="text" id="orden-responsable-externo" class="form-input" placeholder="Ej: Taller Mecánico Externo">
                </div>
                <div class="form-group">
                    <label for="orden-hallazgo-id">Hallazgo relacionado</label>
                    <input type="hidden" id="orden-hallazgo-id" name="hallazgo_id">
                    <p id="orden-hallazgo-selected" class="selector-selected">Ninguno.</p>
                </div>
                <div class="form-group">
                    <label for="orden-fecha-estimada">Fecha estimada de finalización</label>
                    <input type="date" id="orden-fecha-estimada" class="form-input" name="fecha_estimada">
                </div>
                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="orden-hora-inicio">Hora inicio estim.</label>
                        <input type="time" id="orden-hora-inicio" class="form-input" name="hora_inicio">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="orden-hora-fin">Hora fin estim.</label>
                        <input type="time" id="orden-hora-fin" class="form-input" name="hora_fin">
                    </div>
                </div>
                <input type="hidden" id="orden-id" name="orden_id">
            </div>
            <div class="modal-footer">
                <button id="orden-cancel-btn" type="button" class="btn-secondary">Cancelar</button>
                <button type="submit" class="btn-primary">
                    <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    Guardar
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Detalle de Orden -->
<div id="orden-detalle-modal" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="orden-detalle-title">
        <div class="modal-header">
            <h2 id="orden-detalle-title">Detalle de Orden</h2>
            <button id="orden-detalle-close" type="button" class="btn-close" aria-label="Cerrar detalle">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="modal-body">
            <div id="orden-detalle-info" style="margin-bottom: 1rem;"></div>
            
            <div class="orden-detalle-tabs" style="display: flex; gap: 1rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem;">
                <button class="orden-tab-btn active" data-tab="actividades" style="background:none; border:none; border-bottom: 2px solid var(--primary); padding-bottom: 0.5rem; font-weight: 700; color: var(--primary); cursor: pointer;">Actividades</button>
                <button class="orden-tab-btn" data-tab="costos" style="background:none; border:none; padding-bottom: 0.5rem; font-weight: 600; color: var(--text-muted); cursor: pointer;">Costos</button>
                <button class="orden-tab-btn" data-tab="evidencias" style="background:none; border:none; padding-bottom: 0.5rem; font-weight: 600; color: var(--text-muted); cursor: pointer;">Evidencias</button>
                <button class="orden-tab-btn" data-tab="historial" style="background:none; border:none; padding-bottom: 0.5rem; font-weight: 600; color: var(--text-muted); cursor: pointer;">Historial</button>
            </div>
            
            <div id="orden-detalle-content" class="chequeo-detalle-content">
                <div id="orden-detalle-actividades" class="orden-tab-content active">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <h4 style="margin:0; font-size: 1rem; color: var(--primary);">Actividades</h4>
                        <button id="actividad-nuevo-btn" type="button" class="btn-primary" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">Agregar</button>
                    </div>
                    <div id="orden-actividades-list" class="list-container"></div>
                </div>
                <div id="orden-detalle-costos" class="orden-tab-content" style="display: none;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <h4 style="margin:0; font-size: 1rem; color: var(--primary);">Costos</h4>
                        <button id="costo-nuevo-btn" type="button" class="btn-primary" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">Agregar</button>
                    </div>
                    <div id="orden-costos-list" class="list-container"></div>
                </div>
                <div id="orden-detalle-evidencias" class="orden-tab-content" style="display: none;">
                    <div id="orden-evidencias-list" class="list-container"></div>
                </div>
                <div id="orden-detalle-historial" class="orden-tab-content" style="display: none;">
                    <div id="orden-vehiculo-especificaciones-resumen" style="margin-bottom: 15px; padding: 12px; background: #eaf3ed; border-left: 4px solid var(--primary); border-radius: 4px; display: none;">
                        <strong>Especificaciones del Vehículo:</strong>
                        <p id="orden-vh-especificaciones-texto" style="margin: 5px 0 0 0; color: #333; font-style: italic; white-space: pre-line; font-size: 0.95em;"></p>
                    </div>
                    <h4 style="margin: 15px 0 10px 0; font-size: 1.05em; font-weight: bold; color: var(--primary);">Historial de Mantenimientos</h4>
                    <div id="orden-vehiculo-historial-timeline" class="timeline-container" style="margin-bottom: 20px; max-height: 250px; overflow-y: auto;">
                    </div>
                    <h4 style="margin: 15px 0 10px 0; font-size: 1.05em; font-weight: bold; color: var(--primary);">Historial de Cambios</h4>
                    <div id="orden-historial-list" class="list-container"></div>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button id="orden-export-pdf-single-btn" type="button" class="btn-secondary" style="margin-right: auto; display: none;">Exportar PDF</button>
            <button id="orden-export-excel-single-btn" type="button" class="btn-secondary" style="margin-right: 10px; display: none;">Exportar Excel</button>
            <button id="orden-detalle-accept" type="button" class="btn-primary">Cerrar</button>
        </div>
    </div>
</div>

<!-- Modal Actividad -->
<div id="actividad-modal" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="actividad-form-title">
        <div class="modal-header">
            <h2 id="actividad-form-title">Agregar Actividad</h2>
            <button id="actividad-close-btn" type="button" class="btn-close" aria-label="Cerrar">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <form id="actividad-form" class="management-form">
            <div class="modal-body">
                <div class="form-group">
                    <label for="actividad-descripcion">Descripción *</label>
                    <textarea id="actividad-descripcion" name="descripcion" class="form-input" rows="3" required placeholder="Describe la actividad realizada"></textarea>
                </div>
                <div class="form-group">
                    <label for="actividad-estado">Estado</label>
                    <select id="actividad-estado" name="estado" class="form-input">
                        <option value="pendiente">Pendiente</option>
                        <option value="en_curso">En curso</option>
                        <option value="completada">Completada</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="actividad-observaciones">Observaciones</label>
                    <textarea id="actividad-observaciones" name="observaciones" class="form-input" rows="2" placeholder="Observaciones"></textarea>
                </div>
                <input type="hidden" id="actividad-id" name="actividad_id">
            </div>
            <div class="modal-footer">
                <button id="actividad-cancel-btn" type="button" class="btn-secondary">Cancelar</button>
                <button type="submit" class="btn-primary">
                    <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    Guardar
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Costo -->
<div id="costo-modal" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="costo-form-title">
        <div class="modal-header">
            <h2 id="costo-form-title">Agregar Costo</h2>
            <button id="costo-close-btn" type="button" class="btn-close" aria-label="Cerrar">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <form id="costo-form" class="management-form">
            <div class="modal-body">
                <div class="form-group">
                    <label for="costo-concepto">Concepto *</label>
                    <input type="text" id="costo-concepto" name="concepto" class="form-input" required maxlength="200" placeholder="Ej: Cambio de frenos">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="costo-tipo">Tipo</label>
                        <select id="costo-tipo" name="tipo" class="form-input">
                            <option value="repuesto">Repuesto</option>
                            <option value="mano_de_obra">Mano de Obra</option>
                            <option value="servicio_externo">Servicio Externo</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="costo-monto">Monto *</label>
                        <input type="number" id="costo-monto" name="monto" class="form-input" required min="0" step="0.01" placeholder="0.00">
                    </div>
                </div>
                <div class="form-group">
                    <label for="costo-observaciones">Observaciones</label>
                    <textarea id="costo-observaciones" name="observaciones" class="form-input" rows="2" placeholder="Observaciones"></textarea>
                </div>
                <input type="hidden" id="costo-id" name="costo_id">
            </div>
            <div class="modal-footer">
                <button id="costo-cancel-btn" type="button" class="btn-secondary">Cancelar</button>
                <button type="submit" class="btn-primary">
                    <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    Guardar
                </button>
            </div>
        </form>
    </div>
</div>
