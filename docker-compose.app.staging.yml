services:
  scv-backend-staging:
    build:
      context: ./scv-backend
    container_name: scv-backend-staging
    env_file:
      - ./scv-backend/.env.staging
    environment:
      DATABASE_URL: sqlite:////app/data/scv.db
    volumes:
      - scv-staging-db:/app/data
    expose:
      - "9000"
    restart: unless-stopped
    networks:
      - vps-gateway

  scv-frontend-staging:
    build:
      context: ./scv-frontend
    container_name: scv-frontend-staging
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - vps-gateway

volumes:
  scv-staging-db:
    name: scv-staging-db

networks:
  vps-gateway:
    external: true
