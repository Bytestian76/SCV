# Bloque de redirección HTTP a HTTPS
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Configuración HTTPS
server {
    listen 443 ssl;
    server_name _;

    # Rutas de los certificados generados por Certbot
    # NOTA: Asegúrate de reemplazar midominio.com por tu dominio real si modificas el archivo
    # El archivo docker-compose.prod.yml usa variables, pero Nginx requiere las rutas exactas.
    # Recomendación: Después de obtener el primer certificado, cambiar estas rutas.
    # Inicialmente, para evitar fallos si el certificado no existe, considera generar un
    # certificado self-signed temporal o usar un script de inicialización.
    
    # ssl_certificate /etc/letsencrypt/live/midominio.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/midominio.com/privkey.pem;

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Encabezados de Seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Enrutamiento Backend API
    location /api/ {
        proxy_pass http://api-services:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bloqueo de endpoints de documentación sensible en producción si vienen del exterior
    location ~* ^/(docs|redoc|openapi.json) {
        proxy_pass http://api-services:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Enrutamiento Frontend (React SPA)
    location / {
        proxy_pass http://client-app:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
