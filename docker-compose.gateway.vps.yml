services:
  gateway:
    image: nginx:1.27-alpine
    container_name: vps-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/gateway/conf.d:/etc/nginx/conf.d:ro
      - ./infra/gateway/certs:/etc/letsencrypt
      - ./infra/gateway/www:/var/www/certbot
    restart: unless-stopped
    networks:
      - vps-gateway

networks:
  vps-gateway:
    external: true
