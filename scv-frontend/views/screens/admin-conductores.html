<!-- Pantalla Gestión de Conductores (Admin) -->
<div id="admin-conductores" class="screen" data-module="admin-conductores">
    <header class="app-header">
        <button class="btn-back" onclick="goBack()">← Volver</button>
        <h2>Gestión de Conductores</h2>
        <button class="btn-logout" onclick="logout()">
            <img src="assets/icons/box-arrow-right.svg" alt="" class="btn-icon" aria-hidden="true">
            <span>Cerrar Sesión</span>
        </button>
    </header>
    <div class="dashboard-content admin-management-layout">
        <section class="management-panel">
            <div class="management-toolbar">
                <h3>Conductores registrados</h3>
                <div class="toolbar-actions">
                    <button id="conductor-nuevo-btn" type="button" class="btn-secondary">Nuevo conductor</button>
                    <button id="conductores-export-btn" type="button" class="btn-ghost">Exportar Excel</button>
                    <button id="conductores-export-pdf-btn" type="button" class="btn-ghost">Exportar PDF</button>
                </div>
            </div>
            <p id="conductores-feedback" class="helper-text" aria-live="polite"></p>
            <div class="management-filters">
                <div class="form-group filter-search-group">
                    <label for="conductores-search">Buscar conductores</label>
                    <input id="conductores-search" type="search" placeholder="Nombre, cédula, licencia o categoría">
                </div>
                <div class="filter-row">
                    <div class="form-group">
                        <label for="conductores-estado">Estado</label>
                        <select id="conductores-estado">
                            <option value="todos">Todos</option>
                            <option value="activos">Solo activos</option>
                            <option value="inactivos">Solo inactivos</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="conductores-categoria">Categoría</label>
                        <select id="conductores-categoria">
                            <option value="todas">Todas</option>
                            <option value="A2">A2</option>
                            <option value="B1">B1</option>
                            <option value="B2">B2</option>
                            <option value="C1">C1</option>
                            <option value="C2">C2</option>
                            <option value="C3">C3</option>
                        </select>
                    </div>
                    <button id="conductores-clear-filters" type="button" class="btn-ghost filter-clear-btn">Limpiar filtros</button>
                </div>
                <div class="filter-row filter-row-secondary">
                    <div class="form-group">
                        <label for="conductores-orden">Ordenar por</label>
                        <select id="conductores-orden">
                            <option value="nombre_asc">Nombre (A-Z)</option>
                            <option value="nombre_desc">Nombre (Z-A)</option>
                            <option value="cedula_asc">Cédula (ascendente)</option>
                            <option value="categoria_asc">Categoría (A-Z)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="conductores-licencia">Licencia contiene</label>
                        <input id="conductores-licencia" type="text" placeholder="Ej: 1234">
                    </div>
                </div>
                <p id="conductores-results" class="helper-text filter-results" aria-live="polite"></p>
            </div>
            <div id="conductores-list" class="management-list"></div>
        </section>
    </div>
</div>
