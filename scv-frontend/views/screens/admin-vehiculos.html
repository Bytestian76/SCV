<!-- Pantalla Gestión de Vehículos (Admin) -->
<div id="admin-vehiculos" class="screen" data-module="admin-vehiculos">
    <header class="app-header">
        <button class="btn-back" onclick="goBack()">← Volver</button>
        <h2>Gestión de Vehículos</h2>
        <button class="btn-logout" onclick="logout()">
            <img src="assets/icons/box-arrow-right.svg" alt="" class="btn-icon" aria-hidden="true">
            <span>Cerrar Sesión</span>
        </button>
    </header>
    <div class="dashboard-content admin-management-layout">
        <section class="management-panel">
            <div class="management-toolbar">
                <h3>Flota registrada</h3>
                <div class="toolbar-actions">
                    <button id="vehiculo-nuevo-btn" type="button" class="btn-secondary">Nuevo vehículo</button>
                    <button id="vehiculos-export-btn" type="button" class="btn-ghost">Exportar Excel</button>
                    <button id="vehiculos-export-pdf-btn" type="button" class="btn-ghost">Exportar PDF</button>
                </div>
            </div>
            <p id="vehiculos-feedback" class="helper-text" aria-live="polite"></p>
            <div class="management-filters">
                <div class="form-group filter-search-group">
                    <label for="vehiculos-search">Buscar en flota</label>
                    <input id="vehiculos-search" type="search" placeholder="Placa, marca, modelo, empresa o año">
                </div>
                <div class="filter-row">
                    <div class="form-group">
                        <label for="vehiculos-estado">Estado</label>
                        <select id="vehiculos-estado">
                            <option value="todos">Todos</option>
                            <option value="activos">Solo activos</option>
                            <option value="inactivos">Solo inactivos</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="vehiculos-orden">Ordenar por</label>
                        <select id="vehiculos-orden">
                            <option value="placa_asc">Placa (A-Z)</option>
                            <option value="placa_desc">Placa (Z-A)</option>
                            <option value="anio_desc">Año (más reciente)</option>
                            <option value="anio_asc">Año (más antiguo)</option>
                            <option value="marca_asc">Marca (A-Z)</option>
                        </select>
                    </div>
                    <button id="vehiculos-clear-filters" type="button" class="btn-ghost filter-clear-btn">Limpiar filtros</button>
                </div>
                <div class="filter-row filter-row-secondary">
                    <div class="form-group">
                        <label for="vehiculos-anio-min">Año desde</label>
                        <input id="vehiculos-anio-min" type="number" min="1950" max="2100" placeholder="Ej: 2018">
                    </div>
                    <div class="form-group">
                        <label for="vehiculos-anio-max">Año hasta</label>
                        <input id="vehiculos-anio-max" type="number" min="1950" max="2100" placeholder="Ej: 2026">
                    </div>
                </div>
                <p id="vehiculos-results" class="helper-text filter-results" aria-live="polite"></p>
            </div>
            <div id="vehiculos-list" class="management-list"></div>
        </section>
    </div>
</div>
