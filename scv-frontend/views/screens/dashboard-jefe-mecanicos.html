<!-- Pantalla Dashboard Jefe Mecánicos -->
<div id="dashboard-jefe-mecanicos" class="screen" data-module="dashboard-jefe-mecanicos">
    <header class="app-header">
        <div class="header-brand">
            <p>Panel de Mantenimiento</p>
        </div>
        <button class="btn-logout" onclick="logout()">
            <img src="assets/icons/box-arrow-right.svg" alt="" class="btn-icon" aria-hidden="true">
            <span>Cerrar Sesión</span>
        </button>
    </header>
    <div class="dashboard-content">
        <div class="ops-layout">
            <section class="ops-command">
                <p class="section-kicker">Supervisión</p>
                <h2>Gestión de Hallazgos y Mantenimientos</h2>
                <div class="ops-critical">
                    <span class="stat-number" id="jefe-stat-hallazgos-pendientes">0</span>
                    <span class="stat-label">Hallazgos pendientes de evaluación</span>
                </div>
                <div class="ops-kpi-rack">
                    <div class="stat-card">
                        <span class="stat-number" id="jefe-stat-ordenes-abiertas">0</span>
                        <span class="stat-label">Órdenes abiertas</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-number" id="jefe-stat-ordenes-hoy">0</span>
                        <span class="stat-label">Órdenes hoy</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-number" id="jefe-stat-mecanicos-activos">0</span>
                        <span class="stat-label">Mecánicos activos</span>
                    </div>
                </div>
                <article class="user-credential-card" data-user-credential>
                    <div class="user-credential-icon-wrap">
                        <img data-user-avatar src="assets/icons/people.svg" alt="Perfil de usuario" class="user-credential-icon">
                    </div>
                    <div class="user-credential-content">
                        <p class="user-credential-name" data-user-name>Usuario</p>
                        <p class="user-credential-row"><span>Rol:</span> <strong data-user-rol>Sin rol</strong></p>
                        <p class="user-credential-row"><span>Correo:</span> <strong data-user-email>Sin correo</strong></p>
                    </div>
                </article>
            </section>
            <section class="quick-actions">
                <h3>Acciones rápidas</h3>
                <div class="actions-grid">
                    <button class="action-btn" onclick="navigate('admin-hallazgos')">
                        <img src="assets/icons/search.svg" alt="" class="action-icon" aria-hidden="true">
                        <span>Gestionar Hallazgos</span>
                    </button>
                    <button class="action-btn" onclick="navigate('admin-ordenes')">
                        <img src="assets/icons/tools.svg" alt="" class="action-icon" aria-hidden="true">
                        <span>Gestionar Órdenes</span>
                    </button>
                    <button class="action-btn" onclick="navigate('vehiculos')">
                        <img src="assets/icons/truck.svg" alt="" class="action-icon" aria-hidden="true">
                        <span>Gestionar Vehículos</span>
                    </button>
                    <button class="action-btn" onclick="navigate('admin-estadisticas')">
                        <img src="assets/icons/bar-chart-line.svg" alt="" class="action-icon" aria-hidden="true">
                        <span>Estadísticas Mantenimiento</span>
                    </button>
                </div>
            </section>
        </div>
        <section class="admin-analytics-panel">
            <div class="management-toolbar">
                <h3>Resumen de operaciones</h3>
            </div>
            <div id="jefe-resumen-ordenes" class="list-container"></div>
        </section>
    </div>
</div>
