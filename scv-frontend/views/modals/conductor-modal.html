<!-- Modal Conductor (Nuevo/Editar) -->
<div id="conductor-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-window management-modal" role="dialog" aria-modal="true" aria-labelledby="conductor-form-title">
        <div class="modal-header">
            <h3 id="conductor-form-title">Nuevo conductor</h3>
            <button id="conductor-close-btn" type="button" class="modal-close" aria-label="Cerrar formulario">×</button>
        </div>
        <form id="conductor-form" class="management-form">
            <div class="form-group">
                <label for="cnd-nombre">Nombre completo *</label>
                <input id="cnd-nombre" name="nombre" type="text" required maxlength="140" placeholder="Nombre del conductor">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="cnd-cedula">Cédula *</label>
                    <input id="cnd-cedula" name="cedula" type="text" required maxlength="30" placeholder="Número de cédula">
                </div>
                <div class="form-group">
                    <label for="cnd-licencia">Licencia *</label>
                    <input id="cnd-licencia" name="licencia" type="text" required maxlength="50" placeholder="Número de licencia">
                </div>
            </div>
            <div class="form-group">
                <label for="cnd-categoria">Categoría *</label>
                <select id="cnd-categoria" name="categoria" required>
                    <option value="">Seleccione categoría</option>
                    <option value="A2">A2</option>
                    <option value="B1">B1</option>
                    <option value="B2">B2</option>
                    <option value="C1">C1</option>
                    <option value="C2">C2</option>
                    <option value="C3">C3</option>
                </select>
            </div>
            <div class="form-group">
                <label for="cnd-venc-licencia">Vencimiento de licencia</label>
                <input id="cnd-venc-licencia" name="fecha_venc_licencia" type="date">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-primary btn-form-action">Guardar</button>
                <button id="conductor-cancel-btn" type="button" class="btn-ghost">Cancelar</button>
            </div>
        </form>
    </div>
</div>
