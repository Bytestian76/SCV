    // --- FORMATEADORES DE FECHA Y HORA UNIFICADOS ---
    function formatDateTime(dateStr) {
      if (!dateStr) return '—';
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return String(dateStr);
        return d.toLocaleDateString('es-CO', {
          day: 'numeric',
          month: 'short',
          year: 'numeric'
        }) + ', ' + d.toLocaleTimeString('es-CO', {
          hour: 'numeric',
          minute: '2-digit',
          hour12: true
        }).toLowerCase();
      } catch (e) {
        return String(dateStr);
      }
    }

    function formatDate(dateStr) {
      if (!dateStr) return '—';
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return String(dateStr);
        return d.toLocaleDateString('es-CO', {
          day: 'numeric',
          month: 'short',
          year: 'numeric'
        });
      } catch (e) {
        return String(dateStr);
      }
    }

    function getRelativeTime(dateStr) {
      if (!dateStr) return '';
      try {
        const d = new Date(dateStr);
        const diffMs = Date.now() - d.getTime();
        const diffMin = Math.floor(diffMs / 60000);
        if (diffMin < 1) return 'Hace un momento';
        if (diffMin < 60) return `Hace ${diffMin} min`;
        const diffHours = Math.floor(diffMin / 60);
        if (diffHours < 24) return `Hace ${diffHours} h`;
        const diffDays = Math.floor(diffHours / 24);
        return `Hace ${diffDays} d`;
      } catch (e) {
        return '';
      }
    }

    }

    // --- UTILIDAD EXPORTACIÓN CSV UNIFICADA ---
    function downloadCSV(filename, headers, rows) {
      const escapeCell = (val) => {
        if (val === null || val === undefined) return '""';
        const str = String(val).replace(/"/g, '""');
        return `"${str}"`;
      };

      const csvContent = '\uFEFF' + [
        headers.map(escapeCell).join(';'),
        ...rows.map(row => row.map(escapeCell).join(';'))
      ].join('\r\n');

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    // --- COMPONENTE BÚSQUEDA INTELIGENTE / SMART SEARCH ---
    function SmartSearchSelect({
      label,
      required = false,
      placeholder = "Buscar...",
      items = [],
      selectedId,
      onSelect,
      searchKeys = ['nombre'],
      renderOption,
      renderSelected,
      icon = "search"

      const [isOpen, setIsOpen] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const containerRef = useRef(null);

      const selectedItem = items.find(it => String(it.id) === String(selectedId));

      useEffect(() => {
        const handleClickOutside = (event) => {
          if (containerRef.current && !containerRef.current.contains(event.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      const filteredItems = items.filter(item => {
        if (!searchTerm.trim()) return true;
        const q = searchTerm.toLowerCase().trim();
        return searchKeys.some(key => {
          const val = item[key];
          return val !== null && val !== undefined && String(val).toLowerCase().includes(q);
        });
      });

      const handleSelect = (item) => {
        onSelect(item);
        setSearchTerm('');
        setIsOpen(false);
      };

        <div className="form-group" ref={containerRef} style={{ position: 'relative' }}>

              <div style={{ flex: 1, fontSize: '12.5px', color: selectedItem ? '#0f172a' : '#94a3b8', fontWeight: selectedItem ? '600' : '400', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>

            </div>
            <Icon name={isOpen ? "chevron-up" : "chevron-down"} size={13} color="#94a3b8" style={{ flexShrink: 0, marginLeft: '4px' }} />
          </div>

          {isOpen && (
            <div

              <div style={{ padding: '6px 8px', borderBottom: '1px solid #f1f5f9', background: '#f8fafc', display: 'flex', alignItems: 'center', gap: '6px' }}>
                <Icon name="search" size={13} color="#94a3b8" />
                <input
                  type="text"
                  autoFocus
                  value={searchTerm}
                  onChange={e => setSearchTerm(e.target.value)}
                  placeholder="Escribe para buscar..."
                  onClick={e => e.stopPropagation()}
                  style={{
                    border: 'none',
                    outline: 'none',
                    background: 'transparent',
                    width: '100%',
                    fontSize: '12px',
                    fontFamily: 'inherit',
                    color: '#0f172a'
                  }}
                />
                {searchTerm && (
                  <button
                    type="button"
                    onClick={(e) => { e.stopPropagation(); setSearchTerm(''); }}
                    style={{ border: 'none', background: 'transparent', color: '#94a3b8', cursor: 'pointer', padding: '2px', display: 'flex' }}
                  >
                    <Icon name="x" size={12} />
                  </button>

              <div style={{ overflowY: 'auto', flex: 1, padding: '4px' }}>

                    return (
                      <div

                    );

        setOrdenes([]);

        setConductores([]);

        showToast(reason);
      };

      // Authenticated fetch
      const authFetch = async (url, options = {}) => {
        const curToken = localStorage.getItem('scv_token');
        if (!curToken) {
          handleLogout("Debes iniciar sesión para continuar.");
          throw new Error("No token");
        }
        localStorage.setItem('scv_last_activity', Date.now().toString());

        const response = await fetch(url, {
          ...options,
          headers: {
            ...(options.headers || {}),
            'Authorization': `Bearer ${curToken}`
          }
        });

        if (response.status === 401) {
          handleLogout("Tu sesión ha expirado en el servidor.");
          throw new Error("401 Unauthorized");
        }
        return response;
      };

      // Validar sesión inicial
      useEffect(() => {
        const verifyAuth = async () => {
          const storedToken = localStorage.getItem('scv_token');
          if (!storedToken) {
            setAuthChecking(false);
            return;
          }

          const lastAct = parseInt(localStorage.getItem('scv_last_activity') || '0', 10);
          if (lastAct && (Date.now() - lastAct > INACTIVITY_TIMEOUT_MS)) {
            handleLogout("Tu sesión expiró por inactividad.");
            setAuthChecking(false);
            return;
          }

          try {
            const res = await fetch(`${API_BASE}/auth/me`, {
              headers: { 'Authorization': `Bearer ${storedToken}` }
            });

            if (res.ok) {
              const user = await res.json();
              setCurrentUser(user);

          if (lastAct && (Date.now() - lastAct > INACTIVITY_TIMEOUT_MS)) {

            const obs = (m.observaciones || '').toLowerCase();
            const caj = (m.estado_cajon || '').toLowerCase();
            return placa.includes(q) || cond.includes(q) || aux.includes(q) || prov.includes(q) || obs.includes(q) || caj.includes(q);
          });
        }

        // 3. Rango de fechas
        if (filtroMovFechaInicio) {
          const dIni = new Date(filtroMovFechaInicio + 'T00:00:00');
          list = list.filter(m => new Date(m.fecha_registro) >= dIni);
        }
        if (filtroMovFechaFin) {
          const dFin = new Date(filtroMovFechaFin + 'T23:59:59');
          list = list.filter(m => new Date(m.fecha_registro) <= dFin);
        }

        // 4. Ordenamiento
        list.sort((a, b) => {
          if (filtroMovOrden === 'recientes') return new Date(b.fecha_registro) - new Date(a.fecha_registro);
          if (filtroMovOrden === 'antiguos') return new Date(a.fecha_registro) - new Date(b.fecha_registro);
          if (filtroMovOrden === 'alfabetico_asc') {
            const pA = (a.vehiculo?.placa || '').toLowerCase();
            const pB = (b.vehiculo?.placa || '').toLowerCase();
            return pA.localeCompare(pB);
          }
          if (filtroMovOrden === 'alfabetico_desc') {
            const pA = (a.vehiculo?.placa || '').toLowerCase();
            const pB = (b.vehiculo?.placa || '').toLowerCase();
            return pB.localeCompare(pA);
          }
          if (filtroMovOrden === 'peso_desc') {
            return (Number(b.bascula_peso) || 0) - (Number(a.bascula_peso) || 0);
          }
          return 0;
        });

        return list;
      }, [movimientos, filtroMovBusqueda, filtroMovTipo, filtroMovOrden, filtroMovFechaInicio, filtroMovFechaFin]);

      const vehiculosFiltrados = useMemo(() => {
        let list = [...vehiculos];

        if (filtroVehEstado !== 'todos') {
          list = list.filter(v => v.estado === filtroVehEstado);
        }

        if (filtroVehBusqueda.trim()) {
          const q = filtroVehBusqueda.toLowerCase().trim();
          list = list.filter(v => {
            const placa = (v.placa || '').toLowerCase();
            const marca = (v.marca || '').toLowerCase();
            const modelo = (v.modelo || '').toLowerCase();
            return placa.includes(q) || marca.includes(q) || modelo.includes(q);
          });
        }

        list.sort((a, b) => {
          if (filtroVehOrden === 'recientes') return (b.id || 0) - (a.id || 0);
          if (filtroVehOrden === 'placa_asc') return (a.placa || '').localeCompare(b.placa || '');
          if (filtroVehOrden === 'placa_desc') return (b.placa || '').localeCompare(a.placa || '');
          if (filtroVehOrden === 'km_desc') return (Number(b.kilometraje) || 0) - (Number(a.kilometraje) || 0);
          return 0;
        });

        return list;
      }, [vehiculos, filtroVehBusqueda, filtroVehEstado, filtroVehOrden]);

      const chequeosFiltrados = useMemo(() => {

        if (filtroCheqEstado === 'aprobado') list = list.filter(ch => ch.aprobado === true);
        if (filtroCheqEstado === 'novedad') list = list.filter(ch => ch.aprobado === false);

        if (filtroCheqBusqueda.trim()) {

          list = list.filter(ch => {
            const placa = (ch.vehiculo?.placa || `vehiculo #${ch.vehiculo_id}`).toLowerCase();
            const insp = (ch.usuario?.nombre || '').toLowerCase();
            const obs = (ch.observaciones_generales || '').toLowerCase();
            return placa.includes(q) || insp.includes(q) || obs.includes(q);
          });
        }

        if (filtroCheqFechaInicio) {
          const dIni = new Date(filtroCheqFechaInicio + 'T00:00:00');
          list = list.filter(ch => new Date(ch.fecha_registro) >= dIni);
        }
        if (filtroCheqFechaFin) {
          const dFin = new Date(filtroCheqFechaFin + 'T23:59:59');
          list = list.filter(ch => new Date(ch.fecha_registro) <= dFin);
        }

        list.sort((a, b) => {
          if (filtroCheqOrden === 'recientes') return new Date(b.fecha_registro) - new Date(a.fecha_registro);
          if (filtroCheqOrden === 'antiguos') return new Date(a.fecha_registro) - new Date(b.fecha_registro);
          if (filtroCheqOrden === 'placa_asc') {
            const pA = (a.vehiculo?.placa || '').toLowerCase();
            const pB = (b.vehiculo?.placa || '').toLowerCase();
            return pA.localeCompare(pB);
          }
          return 0;
        });

        return list;
      }, [chequeos, filtroCheqBusqueda, filtroCheqEstado, filtroCheqOrden, filtroCheqFechaInicio, filtroCheqFechaFin]);

      const usuariosFiltrados = useMemo(() => {

            const em = (u.email || '').toLowerCase();
            const ced = (u.cedula || '').toLowerCase();
            const lic = (u.licencia || '').toLowerCase();
            return nom.includes(q) || em.includes(q) || ced.includes(q) || lic.includes(q);
          });

        list.sort((a, b) => {
          if (filtroUserOrden === 'nombre_asc') return (a.nombre || '').localeCompare(b.nombre || '');
          if (filtroUserOrden === 'nombre_desc') return (b.nombre || '').localeCompare(a.nombre || '');
          if (filtroUserOrden === 'recientes') return (b.id || 0) - (a.id || 0);

          'ESTADO_CAJON',

                  </div>

                  <div>
                    <span style={{ fontSize: '10.5px', color: 'var(--text-muted)', fontWeight: '700', textTransform: 'uppercase' }}>Observaciones:</span>
                    <p style={{ fontSize: '12px', color: 'var(--text-secondary)', marginTop: '2px' }}>{detalleChequeo.observaciones_generales || 'Sin observaciones.'}</p>
                  </div>
                </div>
                <div className="modal-footer">
                  <button type="button" onClick={() => setDetalleChequeo(null)} className="btn-secondary">Cerrar</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: MOVIMIENTO */}
          {modalMovimiento && (
            <div className="modal-backdrop" onClick={() => setModalMovimiento(false)}>
              <div className="modal-card" style={{ maxWidth: '520px' }} onClick={e => e.stopPropagation()}>
                <div className="modal-header">
                  <h3><Icon name="arrow-left-right" size={16} color="var(--emerald-600)" /> {editingMovimientoId ? `Editar movimiento #${editingMovimientoId}` : "Registrar movimiento"}</h3>
                  <button className="modal-close-btn" onClick={() => setModalMovimiento(false)}>✕</button>
                </div>
                <form onSubmit={handleCrearMovimiento}>
                  <div className="modal-body">
                    <div className="form-group">
                      <label>Tipo de movimiento</label>
                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
                        <button type="button" onClick={() => setFormMovimiento({...formMovimiento, tipo: 'salida'})} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '6px', padding: '8px', borderRadius: '6px', border: '2px solid', borderColor: formMovimiento.tipo === 'salida' ? 'var(--emerald-600)' : '#cbd5e1', background: formMovimiento.tipo === 'salida' ? 'var(--emerald-50)' : '#fff', fontWeight: '700', color: formMovimiento.tipo === 'salida' ? 'var(--emerald-700)' : 'var(--text-secondary)', cursor: 'pointer', fontFamily: 'inherit', fontSize: '12px' }}>
                          <Icon name="arrow-up-right" size={14} />
                          <span>SALIDA</span>
                        </button>
                        <button type="button" onClick={() => setFormMovimiento({...formMovimiento, tipo: 'entrada'})} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '6px', padding: '8px', borderRadius: '6px', border: '2px solid', borderColor: formMovimiento.tipo === 'entrada' ? 'var(--blue-600)' : '#cbd5e1', background: formMovimiento.tipo === 'entrada' ? 'var(--blue-50)' : '#fff', fontWeight: '700', color: formMovimiento.tipo === 'entrada' ? 'var(--blue-700)' : 'var(--text-secondary)', cursor: 'pointer', fontFamily: 'inherit', fontSize: '12px' }}>
                          <Icon name="arrow-down-left" size={14} />
                          <span>ENTRADA</span>
                        </button>
                      </div>
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1.2fr 1fr', gap: '10px' }}>
                      <SmartSearchSelect
                        label="Vehículo"
                        required={true}
                        placeholder="Buscar vehículo..."
                        items={vehiculos}
                        selectedId={formMovimiento.vehiculo_id}
                        searchKeys={['placa', 'marca', 'modelo']}
                        icon="truck"
                        onSelect={(v) => {
                          setFormMovimiento(prev => ({
                            ...prev,
                            vehiculo_id: v.id,
                            kilometraje: prev.kilometraje !== '' ? prev.kilometraje : (v.kilometraje || '')
                          }));
                        }}
                        renderSelected={(v) => `${v.placa} • ${v.marca} ${v.modelo}`}
                        renderOption={(v, isSelected) => (
                          <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                            <span style={{ fontWeight: '800', color: isSelected ? '#047857' : '#0f172a' }}>{v.placa}</span>
                            <span style={{ color: '#64748b' }}>({v.marca})</span>
                          </div>
                        )}
                      />

                      <SmartSearchSelect
                        label="Conductor"
                        required={true}
                        placeholder="Buscar conductor..."
                        items={conductores.length > 0 ? conductores : usuariosList}
                        selectedId={formMovimiento.usuario_id}
                        searchKeys={['nombre', 'cedula']}
                        icon="user"
                        onSelect={(c) => setFormMovimiento(prev => ({ ...prev, usuario_id: c.id }))}
                        renderSelected={(c) => `${c.nombre}`}
                        renderOption={(c, isSelected) => (
                          <div style={{ fontWeight: isSelected ? '700' : '500' }}>{c.nombre}</div>
                        )}
                      />
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                      <div className="form-group">
                        <label>Auxiliar (Opcional)</label>
                        <input type="text" placeholder="Acompañante" value={formMovimiento.auxiliar} onChange={e => setFormMovimiento({...formMovimiento, auxiliar: e.target.value})} className="form-input" />
                      </div>
                      <div className="form-group">
                        <label>Proveedor / Destino (Opcional)</label>
                        <input type="text" placeholder="Cliente / Proveedor" value={formMovimiento.proveedor} onChange={e => setFormMovimiento({...formMovimiento, proveedor: e.target.value})} className="form-input" />
                      </div>
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                      <div className="form-group">
                        <label>Kilometraje (Opcional)</label>
                        <input type="number" placeholder="Ej: 145000" value={formMovimiento.kilometraje} onChange={e => setFormMovimiento({...formMovimiento, kilometraje: e.target.value})} className="form-input" />
                      </div>
                      <div className="form-group">
                        <label>Peso báscula (kg)</label>
                        <input type="number" placeholder="Ej: 12500" value={formMovimiento.bascula_peso} onChange={e => setFormMovimiento({...formMovimiento, bascula_peso: e.target.value})} className="form-input" />
                      </div>
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                      <div className="form-group">
                        <label>Sacas (Opcional)</label>
                        <input type="number" placeholder="Cantidad" value={formMovimiento.cantidad_sacas} onChange={e => setFormMovimiento({...formMovimiento, cantidad_sacas: e.target.value})} className="form-input" />
                      </div>
                      <div className="form-group">
                        <label>Estado cajón (Opcional)</label>
                        <input type="text" placeholder="Bueno, regular..." value={formMovimiento.estado_cajon} onChange={e => setFormMovimiento({...formMovimiento, estado_cajon: e.target.value})} className="form-input" />
                      </div>
                    </div>

                    <div className="form-group">
                      <label>Observaciones</label>
                      <input type="text" placeholder="Ruta, destino o notas..." value={formMovimiento.observaciones} onChange={e => setFormMovimiento({...formMovimiento, observaciones: e.target.value})} className="form-input" />
                    </div>
                  </div>
                  <div className="modal-footer">
                    <button type="button" onClick={() => setModalMovimiento(false)} className="btn-secondary">Cancelar</button>
                    <button type="submit" className="btn-primary">{editingMovimientoId ? "Actualizar" : "Guardar"}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: ORDEN DE TRABAJO (OT) */}
          {modalOT && (
            <div className="modal-backdrop" onClick={() => setModalOT(false)}>
              <div className="modal-card" style={{ maxWidth: '480px' }} onClick={e => e.stopPropagation()}>
                <div className="modal-header">
                  <h3><Icon name="wrench" size={16} color="var(--purple-600)" /> {editingOTId ? `Editar orden #${editingOTId}` : "Nueva orden de trabajo"}</h3>
                  <button className="modal-close-btn" onClick={() => setModalOT(false)}>✕</button>
                </div>
                <form onSubmit={handleCrearOT}>
                  <div className="modal-body">
                    <SmartSearchSelect
                      label="Vehículo"
                      required={true}
                      placeholder="Buscar vehículo..."
                      items={vehiculos}
                      selectedId={formOT.vehiculo_id}
                      searchKeys={['placa', 'marca', 'modelo']}
                      icon="truck"
                      onSelect={(v) => setFormOT(prev => ({ ...prev, vehiculo_id: v.id }))}
                      renderSelected={(v) => `${v.placa} • ${v.marca} ${v.modelo}`}
                      renderOption={(v, isSelected) => (
                        <div style={{ fontWeight: isSelected ? '700' : '500' }}>{v.placa} - {v.marca}</div>
                      )}
                    />

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                      <div className="form-group">
                        <label>Prioridad *</label>
                        <select value={formOT.prioridad} onChange={e => setFormOT({...formOT, prioridad: e.target.value})} className="form-select">
                          <option value="baja">Baja</option>
                          <option value="media">Media</option>
                          <option value="alta">Alta</option>
                          <option value="critica">Crítica</option>
                        </select>
                      </div>

                      {editingOTId ? (
                        <div className="form-group">
                          <label>Estado *</label>
                          <select value={formOT.estado} onChange={e => setFormOT({...formOT, estado: e.target.value})} className="form-select">
                            <option value="pendiente">Pendiente</option>
                            <option value="en_progreso">En progreso</option>
                            <option value="completada">Completada</option>
                            <option value="cancelada">Cancelada</option>
                          </select>
                        </div>
                      ) : (
                        <div className="form-group">
                          <label>Mecánico</label>
                          <select value={formOT.responsable_id} onChange={e => setFormOT({...formOT, responsable_id: e.target.value})} className="form-select">
                            <option value="">Seleccionar...</option>
                            {usuariosList.filter(u => u.rol && (u.rol.includes('mecanico') || u.rol.includes('taller'))).map(m => (
                              <option key={m.id} value={m.id}>{m.nombre}</option>
                            ))}
                          </select>
                        </div>
                      )}
                    </div>

                    <div className="form-group">
                      <label>Descripción del trabajo *</label>
                      <textarea required placeholder="Trabajo a realizar en taller..." rows={3} value={formOT.descripcion} onChange={e => setFormOT({...formOT, descripcion: e.target.value})} className="form-textarea" style={{ resize: 'none' }} />
                    </div>
                  </div>
                  <div className="modal-footer">
                    <button type="button" onClick={() => setModalOT(false)} className="btn-secondary">Cancelar</button>
                    <button type="submit" className="btn-primary">{editingOTId ? "Actualizar" : "Crear orden"}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: EVALUAR HALLAZGO */}
          {modalEvaluarHallazgo && (
            <div className="modal-backdrop" onClick={() => setModalEvaluarHallazgo(null)}>
              <div className="modal-card" style={{ maxWidth: '520px' }} onClick={e => e.stopPropagation()}>
                <div className="modal-header">
                  <h3><Icon name="wrench" size={16} color="var(--emerald-600)" /> Evaluar hallazgo y crear OT</h3>
                  <button className="modal-close-btn" onClick={() => setModalEvaluarHallazgo(null)}>✕</button>
                </div>
                <form onSubmit={handleConvertirOT}>
                  <div className="modal-body">
                    <div style={{ background: '#f8fafc', border: '1px solid #e2e8f0', borderRadius: '8px', padding: '10px 12px', fontSize: '12px', display: 'flex', flexDirection: 'column', gap: '6px' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                        <div><span style={{ color: '#64748b', fontSize: '10.5px' }}>Vehículo:</span> <strong style={{ color: '#047857' }}>{modalEvaluarHallazgo.vehiculo?.placa || `#${modalEvaluarHallazgo.vehiculo_id}`}</strong></div>
                        <div><span style={{ color: '#64748b', fontSize: '10.5px' }}>Reportó:</span> <strong>{modalEvaluarHallazgo.usuario_reporta?.nombre || 'Inspector'}</strong></div>
                      </div>
                      <div style={{ background: '#fff', border: '1px solid #fecdd3', padding: '8px', borderRadius: '6px', color: '#be123c', fontWeight: '600' }}>
                        {modalEvaluarHallazgo.descripcion}
                      </div>
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                      <div className="form-group">
                        <label>Categoría *</label>
                        <select required value={formEvaluar.categoria} onChange={e => setFormEvaluar({...formEvaluar, categoria: e.target.value})} className="form-select">
                          <option value="mecanica">Mecánica General</option>
                          <option value="frenos">Frenos</option>
                          <option value="electrica">Eléctrica & Luces</option>
                          <option value="neumaticos">Neumáticos</option>
                          <option value="fluidos">Fluidos & Aceite</option>
                          <option value="cabina">Cabina & Seguridad</option>
                        </select>
                      </div>

                      <div className="form-group">
                        <label>Prioridad *</label>
                        <select required value={formEvaluar.prioridad} onChange={e => setFormEvaluar({...formEvaluar, prioridad: e.target.value})} className="form-select">
                          <option value="baja">Baja</option>
                          <option value="media">Media</option>
                          <option value="alta">Alta</option>
                          <option value="critica">Crítica</option>
                        </select>
                      </div>
                    </div>

                    <div className="form-group">
                      <label>Mecánico asignado</label>
                      <select value={formEvaluar.responsable_id} onChange={e => setFormEvaluar({...formEvaluar, responsable_id: e.target.value})} className="form-select">
                        <option value="">Seleccionar mecánico...</option>
                        {usuariosList.filter(u => u.rol && (u.rol.includes('mecanico') || u.rol.includes('jefe') || u.rol.includes('taller'))).map(m => (
                          <option key={m.id} value={m.id}>{m.nombre}</option>
                        ))}
                      </select>
                    </div>

                    <div className="form-group">
                      <label>Instrucciones para taller *</label>
                      <textarea required rows={3} value={formEvaluar.descripcion_trabajo} onChange={e => setFormEvaluar({...formEvaluar, descripcion_trabajo: e.target.value})} className="form-textarea" style={{ resize: 'none' }} placeholder="Reparación o pruebas a realizar..." />
                    </div>
                  </div>
                  <div className="modal-footer">
                    <button type="button" onClick={() => setModalEvaluarHallazgo(null)} className="btn-secondary">Cancelar</button>
                    <button type="submit" className="btn-primary">Crear orden de trabajo</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: HOJA DE VIDA */}
          {modalHojaVida && (
            <div className="modal-backdrop" onClick={() => setModalHojaVida(null)}>
              <div className="modal-card" style={{ maxWidth: '720px' }} onClick={e => e.stopPropagation()}>
                <div className="modal-header">
                  <h3>
                    <Icon name="file-text" size={16} color="var(--purple-600)" />
                    Hoja de vida — {modalHojaVida.vehiculo.placa} ({modalHojaVida.vehiculo.marca} {modalHojaVida.vehiculo.modelo})
                  </h3>
                  <button className="modal-close-btn" onClick={() => setModalHojaVida(null)}>✕</button>
                </div>
                <div className="modal-body">
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '8px' }}>
                    <div style={{ background: '#f8fafc', border: '1px solid #e2e8f0', borderRadius: '6px', padding: '8px', textAlign: 'center' }}>
                      <div style={{ fontSize: '10px', color: '#64748b', fontWeight: '700', textTransform: 'uppercase' }}>Estado</div>
                      <div style={{ marginTop: '2px' }}>
                        <span className={`status-pill ${modalHojaVida.vehiculo.estado === 'activo' ? 'in-motion' : 'critical'}`}>
                          {modalHojaVida.vehiculo.estado.toUpperCase()}
                        </span>
                      </div>
                    </div>

                    <div style={{ background: '#f8fafc', border: '1px solid #e2e8f0', borderRadius: '6px', padding: '8px', textAlign: 'center' }}>
                      <div style={{ fontSize: '10px', color: '#64748b', fontWeight: '700', textTransform: 'uppercase' }}>Órdenes</div>
                      <div style={{ fontSize: '16px', fontWeight: '800', color: '#0f172a' }}>{modalHojaVida.resumen.total_ordenes}</div>
                      <div style={{ fontSize: '9.5px', color: '#059669', fontWeight: '700' }}>{modalHojaVida.resumen.ordenes_completadas} cerradas</div>
                    </div>

                    <div style={{ background: '#f8fafc', border: '1px solid #e2e8f0', borderRadius: '6px', padding: '8px', textAlign: 'center' }}>
                      <div style={{ fontSize: '10px', color: '#64748b', fontWeight: '700', textTransform: 'uppercase' }}>Inspecciones</div>
                      <div style={{ fontSize: '16px', fontWeight: '800', color: '#0f172a' }}>{modalHojaVida.resumen.total_chequeos}</div>
                      <div style={{ fontSize: '9.5px', color: '#64748b' }}>Pre-op</div>
                    </div>

                    <div style={{ background: '#f8fafc', border: '1px solid #e2e8f0', borderRadius: '6px', padding: '8px', textAlign: 'center' }}>
                      <div style={{ fontSize: '10px', color: '#64748b', fontWeight: '700', textTransform: 'uppercase' }}>Inversión taller</div>
                      <div style={{ fontSize: '15px', fontWeight: '800', color: '#7c3aed' }}>${modalHojaVida.resumen.inversion_mantenimiento_total.toLocaleString()}</div>
                    </div>
                  </div>

                  <div>
                    <h4 style={{ fontSize: '12.5px', fontWeight: '700', marginBottom: '6px' }}>Historial de órdenes de trabajo</h4>
                    {modalHojaVida.ordenes_trabajo && modalHojaVida.ordenes_trabajo.length > 0 ? (
                      <div style={{ display: 'flex', flexDirection: 'column', gap: '6px', maxHeight: '160px', overflowY: 'auto' }}>
                        {modalHojaVida.ordenes_trabajo.map(ot => (
                          <div key={ot.id} style={{ background: '#ffffff', border: '1px solid #e2e8f0', borderRadius: '6px', padding: '8px 10px', fontSize: '12px' }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                              <div style={{ display: 'flex', gap: '6px', alignItems: 'center' }}>
                                <strong style={{ color: 'var(--purple-700)' }}>{ot.codigo}</strong>
                                <span className={`status-pill ${ot.estado === 'completada' ? 'completed' : 'warning'}`}>{ot.estado.toUpperCase()}</span>
                              </div>
                              <span style={{ fontSize: '10.5px', color: '#64748b' }}>{formatDate(ot.fecha_creacion)}</span>
                            </div>
                            <div style={{ marginTop: '3px', color: '#0f172a' }}>{ot.descripcion}</div>
                            <div style={{ fontSize: '11px', color: '#64748b', marginTop: '2px' }}>Técnico: {ot.mecanico}</div>
                          </div>
                        ))}
                      </div>
                    ) : (
                      <p style={{ fontSize: '12px', color: 'var(--text-muted)', padding: '8px' }}>Sin intervenciones de taller registradas.</p>
                    )}
                  </div>

                  <div>
                    <h4 style={{ fontSize: '12.5px', fontWeight: '700', marginBottom: '6px' }}>Últimas inspecciones pre-op</h4>
                    {modalHojaVida.chequeos_recientes && modalHojaVida.chequeos_recientes.length > 0 ? (
                      <div style={{ display: 'flex', flexDirection: 'column', gap: '4px', maxHeight: '140px', overflowY: 'auto' }}>
                        {modalHojaVida.chequeos_recientes.slice(0, 5).map(ch => (
                          <div key={ch.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '6px 8px', background: '#ffffff', border: '1px solid #e2e8f0', borderRadius: '6px', fontSize: '11.5px' }}>
                            <div>
                              <strong>{formatDate(ch.fecha)}</strong> • {Number(ch.kilometraje).toLocaleString()} km • {ch.inspector}
                            </div>
                            <span className={`status-pill ${ch.aprobado ? 'completed' : 'critical'}`}>
                              {ch.aprobado ? 'CONFORME' : 'NOVEDAD'}
                            </span>
                          </div>
                        ))}
                      </div>
                    ) : (
                      <p style={{ fontSize: '12px', color: 'var(--text-muted)', padding: '8px' }}>Sin inspecciones registradas.</p>
                    )}
                  </div>
                </div>
                <div className="modal-footer">
                  <button type="button" onClick={() => setModalHojaVida(null)} className="btn-secondary">Cerrar</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
