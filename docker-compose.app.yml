services:
  scv-backend:
    build:
      context: ./scv-backend
    container_name: scv-backend
    env_file:
      - ./scv-backend/.env
    environment:
      DATABASE_URL: sqlite:////app/data/scv.db
    volumes:
      - scv-db:/app/data
    expose:
      - "9000"
    restart: unless-stopped
    networks:
      - scv-network
      - vps-gateway

  scv-frontend:
    build:
      context: ./scv-frontend
    container_name: scv-frontend
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - scv-network
      - vps-gateway

  scv-frontend-v2:
    build:
      context: ./scv-frontend-v2
    container_name: scv-frontend-v2
    expose:
      - "80"
    volumes:
      - ./scv-frontend-v2:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - scv-network
      - vps-gateway

volumes:
  scv-db:

networks:
  scv-network:
    external: true
  vps-gateway:
    external: true
