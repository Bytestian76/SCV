services:
  gateway:
    image: nginx:1.27-alpine
    container_name: scv-gateway
    ports:
      - "8000:80"
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/gateway/scv-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
